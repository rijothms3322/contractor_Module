<style>
        .glass-pulse {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(9, 100, 144, 0.1);
        }
        .heartbeat-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            background: #096490;
            opacity: 0.1;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        /* Static visual representation of pulse since animations are prohibited */
        .pulse-visual-layer-1 {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(9, 100, 144, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .pulse-visual-layer-2 {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(9, 100, 144, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            position: absolute;
        }
        .splash-gradient {
            background: radial-gradient(circle at center, #F8FAFC 0%, #E7EEFF 100%);
        }
    </style>
